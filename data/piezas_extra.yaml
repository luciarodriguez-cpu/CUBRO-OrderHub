# =============================================================================
# data/piezas_extra.yaml
# Piezas sueltas que se añaden a mano al pedido (no llegan por CSV): sección
# "Piezas extra" del Paso 1. Cada pieza sale en el JSON como una línea p_item
# propia al final del pedido (después de muebles y accesorios).
#
# Fuente: encargo de Lucía (20/10/2026) + HBM_CubroxSchmidt_indice_D.xlsm →
# "Ind. E_Pièces détachées" (designaciones FR y opciones por pieza).
#
# p_hinge: frentes G/D (obligatorio, lo elige el usuario) · baldas no llevan.
# p_fastening: ninguna pieza lo lleva.
# Medidas en el JSON (regla general del p_item, ver CLAUDE.md):
#   medida fija → 0 (SG la conoce por el código) · medida variable → valor real.
#   Solo FVV (ancho y alto) y ETEOV37 (ancho) envían medidas reales.
#
# Solo se usan opciones que ya existen en el Order Hub. Valores:
#   op_100 gama · op_101 acabado del frente · op_200 color interior
#   op_203 canto (forzada, E14) · op_206 cierre (forzada, FSP)
#   op_121 SPF · op_217 TL1 (tirador Touch Latch) · op_220 PRB · op_222 DTD/DTG
#   op_223 cajón interior (TLH) · op_231 reducción de ancho (RL3, p_param1)
#   op_300 / op_301 tirador y color · op_410 acabado mueble abierto · op_700 DEM
# =============================================================================


# ── Tipos del desplegable (orden de la UI) ──────────────────────────────────
# Solo los tipos de esta lista se ofrecen en el Paso 1 y salen en el JSON.
# Frentes: BLOQUEADOS por ahora (Notion «Piezas extra», punto 7: falta que SG
# confirme cómo se identifica un frente pedido suelto). Sus 28 piezas siguen
# definidas abajo; para desbloquearlos basta con añadir «Frentes» a esta lista.
tipos:
  - Baldas interiores mueble


# ── Grupos de opciones ──────────────────────────────────────────────────────
# Fuente: Notion «Piezas extra» (Fichas por elemento de catálogo), columna
# «¿Se envía?». Solo están las opciones marcadas «Sí». Las marcadas «No, por
# ahora» (pendientes de confirmar con SG) NO se ofrecen ni se envían:
#   op_223 (TLH) y op_700 (DEM) en todos los frentes        → punto 1
#   op_220 (PRB) y op_222 (DTD/DTG) en F45100                → punto 2
#   op_200 (color de cuerpo) en F6013                        → punto 4
#   op_100 (gama) en las baldas ETCA                          → punto 6
# Si SG confirma alguna, se añade aquí y se empieza a enviar.
#
# obligatorias: el usuario tiene que elegirlas antes de añadir la pieza.
# forzadas:     se envían siempre, con el valor indicado.
# facultativas: el usuario puede activarlas.
# apertura:     true → p_hinge obligatorio (G izquierda · D derecha).
grupos_opciones:
  frente:                 # frentes fijos, F45100 y F6013
    apertura: true
    obligatorias: [op_100, op_101, op_300, op_301]
    forzadas: {op_206: FSP}
    facultativas: [op_121, op_217, op_231]
  frente_sin_tl1:         # F60100: como frente, sin Touch Latch (punto 3)
    apertura: true
    obligatorias: [op_100, op_101, op_300, op_301]
    forzadas: {op_206: FSP}
    facultativas: [op_121, op_231]
  frente_variable:        # FVV: como frente, sin reducción de ancho
    apertura: true
    obligatorias: [op_100, op_101, op_300, op_301]
    forzadas: {op_206: FSP}
    facultativas: [op_121, op_217]
  balda:                  # ETCA: solo color de cuerpo (op_100 «No, por ahora», punto 6)
    obligatorias: [op_200]
    forzadas: {op_203: E14}
    facultativas: []
  balda_variable:         # ETEOV37: solo el acabado (LACA o WOOD)
    obligatorias: [op_410]
    forzadas: {}
    facultativas: []
    gamas_op_410: [LACA, WOOD]


# ── Piezas ──────────────────────────────────────────────────────────────────
# uso: solo en las piezas especiales (texto de ayuda en la UI). El resto son
# baldas estándar para muebles de sus medidas (ancho × fondo). Esquineras (X)
# y ETEOV37: designación de SG en el índice D (hoja AS400) y tarif V5.
# ancho / alto (frentes) o ancho / fondo (baldas) en mm, solo informativo en la
# UI. ancho_variable / alto_variable: medida que introduce el usuario y que se
# envía en p_width / p_height. Rangos pendientes de confirmar con el tarif.
