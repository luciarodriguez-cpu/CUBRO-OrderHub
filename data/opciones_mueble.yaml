# =============================================================================
# data/opciones_mueble.yaml
# Para cada opción/parámetro SG: lista de muebles y tipo de aplicación.
#
# Leyenda:
#   O — Obligatoria: siempre se envía, requiere valor del CSV o catálogo
#   F — Forzada: el Módulo C la calcula y aplica automáticamente
#   P — Opcional: se incluye solo si el usuario la selecciona en el Paso 1
#
# Si un mueble no aparece en la lista de una opción → no aplica.
#
# Opciones excluidas (SG las calcula en AS400, no hace falta enviarlas):
#   op_103, op_203, op_204, op_209
#
# Opciones pendientes de confirmar si deben enviarse o no:
#   op_104 — SG indica que la calcula en AS400, pero se conserva hasta confirmación
# =============================================================================


# -----------------------------------------------------------------------------
# p_hinge — Sentido de apertura de puerta
# No sigue el esquema O/F/P: su valor depende del tipo de mueble.
#   lee_csv   → D (Derecha) o G (Gauche/Izquierda) según campo Apertura del CSV
#   nulo      → p_hinge se omite del JSON — muebles con 2 puertas en horizontal (lado a lado, 90 cm)
#   coulissant → C — muebles sin puerta batiente (bloques, extraíbles, frentes)
#   lift      → L — apertura lift (confirmado con SG)
# -----------------------------------------------------------------------------
