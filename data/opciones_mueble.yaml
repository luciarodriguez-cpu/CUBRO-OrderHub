# -----------------------------------------------------------------------------
# variantes_op_126 — Configuración UI y muebles por variante de p_built_in_detail
# Fuente de verdad única: etiqueta UI, subcampos, tipo (auto u opciones) y muebles.
# Antes: la meta (etiqueta, subcampos, tipo) vivía en mapeos_SKP_UI_SG.yaml y
# la lista de muebles aquí. Consolidado en este archivo el 21/05/2026.
# Añadido 21/05/2026, confirmado por Lucía Rodríguez-Bermejo el 21/05/2026.
# -----------------------------------------------------------------------------
variantes_op_126:

  op_126_horno:           # solo horno — BFT
    ui:        Referencia horno
    tipo_auto: Horno       # usado por modulo_c para p_appliance_type — no genera control en la UI
    subcampos:
      marca:      Marca
      referencia: Referencia
      altura:     Altura (mm)
    muebles:
      - BFT608057

  op_126_horno_o_micro:   # horno o micro — AFS, AFS2B
    ui:            Referencia electrodoméstico
    tipo_opciones: [Horno, Micro]   # usado por modulo_c para p_appliance_type — no genera control en la UI
    muebles:
      - AFS6020057
      - AFS6022057
      - AFS2B6020057
      - AFS2B6022057

  op_126_doble:           # dos electros (inferior + superior) — AFSMO, AFSMOBT
    ui:            Electrodomésticos
    doble: true            # electro 1 = inferior, electro 2 = superior
    tipo_opciones: [Horno, Micro, Combi]   # usado por modulo_c para p_appliance_type — no genera control en la UI
    muebles:
      - AFSMO6020057
      - AFSMO6022057
      - AFSMOBT6020057
      - AFSMOBT6022057

  # op_126_placa eliminado (18/06/2026): placa no requiere referencia

  op_126_placa_aspirante: # placa aspirante — BIBTS
    ui:        Referencia placa aspirante
    tipo_auto: "Placa aspirante"   # usado por modulo_c para p_appliance_type — no genera control en la UI
    subcampos:
      marca:      Marca
      referencia: Referencia
    muebles:
      - BIBTS608057
      - BIBTS908057

  op_126_frigorifico:     # frigorífico integrable — A2I
    ui:        Referencia frigorífico
    tipo_auto: Frigo       # usado por modulo_c para p_appliance_type — no genera control en la UI
    subcampos:
      marca:      Marca
      referencia: Referencia
      altura:     Altura (mm)
    muebles:
      - A2I6020057
      - A2I6022057
      - A2I7522057
      - A2I1P6020057
      - A2I1P6022057

  # op_126_lvv_lvd y op_126_lvd eliminados (08/06/2026):
  # LVV/LVD no envían referencia de electro a SG — ni UI ni JSON.

  op_126_campana:         # campana integrada — HH
    ui: Campana
    solo_caso_a: true     # solo Marca + Referencia — Caso B (altura) no disponible
    subcampos:
      marca:      Marca
      referencia: Referencia
    muebles:
      - HH1606035
      - HH1906035
      - HH1608035
      - HH1908035
      - HH16010035
      - HH19010035


