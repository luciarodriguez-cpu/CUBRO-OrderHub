# -----------------------------------------------------------------------------
# op_100 — Gama del frente
# -----------------------------------------------------------------------------
op_100:
  todos: O   # Obligatoria en todos excepto rodapiés (SOCX* y SG codes SOC*)
  excepciones:
    - SOCX10    # no aplica — rodapié (solo op_401)
    - SOCX07    # no aplica — rodapié
    - SOC36010  # código SG de salida — op_401 ya calculado
    - SOC18010  # código SG de salida
    - SOC3607   # código SG de salida
    - SOC1807   # código SG de salida


# -----------------------------------------------------------------------------
# op_101 — Acabado del frente
# -----------------------------------------------------------------------------
op_101:
  todos: O   # Obligatoria en todos excepto rodapiés (SOCX* usan op_401 en su lugar)
  excepciones:
    - SOCX10    # no aplica — rodapié (usa op_401)
    - SOCX07    # no aplica — rodapié
    - SOC36010  # código SG de salida — op_401 ya calculado
    - SOC18010  # código SG de salida
    - SOC3607   # código SG de salida
    - SOC1807   # código SG de salida


# -----------------------------------------------------------------------------
# op_104 — Acabado canto del frente
# F — El código SG depende de la gama (op_100) del mueble, no del mueble concreto.
# Nota: SG indica que calcula esta opción en AS400. Se conserva hasta confirmación
# definitiva de si debe enviarse o no en el JSON del pedido.
#
#   LAC → copia el código de op_101 del mismo mueble (calculado por modulo_c)
#   WOD → vacío, no se envía
#   LNO → HAK (fijo para todos los muebles con gama LINOLEO)
#   LMI → vacío, no se envía
# -----------------------------------------------------------------------------
op_104:
  por_gama:
    LAC: null   # F — copia el código de op_101 del mismo mueble
    WOD: ""     # vacío, no se envía
    LNO: HAK    # F — fijo para todos los muebles con gama LINOLEO
    LMI: ""     # vacío, no se envía


# -----------------------------------------------------------------------------
# op_121 — Sin mecanizado para tirador (SPF)
# Opcional en todos. Forzado automáticamente en dos casos (ver nota):
#   1. AVA1P, AQC31P o A2I1P + tirador Curve o Line → SPF forzado
#   2. Cualquier mueble + tirador Plantea → SPF forzado siempre
# Round y Square nunca llevan SPF.
# -----------------------------------------------------------------------------
op_121:
  todos: P   # Opcional en los 121 muebles del catálogo
  excepciones: []


# -----------------------------------------------------------------------------
# op_200 — Color interior del mueble
# -----------------------------------------------------------------------------
op_200:
  todos: O   # Obligatoria en todos excepto frentes sin mueble (POBIF/PO1BIF/PO2BIF)
  # Tapetas (FF*/FFAL*): SÍ llevan op_200 desde la validación VAC Recoletos (jun 2026),
  # pero el valor viene de un selector manual por mueble en el Módulo B (no del CSV,
  # que no transmite color interior para tapetas) — ver modulo_b._control_color_interior_ff.
