# -----------------------------------------------------------------------------
# rodapiés — SOC*
# Solo op_401 (mismo índice de valores que op_101, misma fuente "Acabado" del CSV).
# Sin op_100, sin apertura, sin tirador, sin color interior, sin patas.
# p_hinge y p_fastening se omiten del JSON.
#
# Flujo de agrupación en Módulo B:
#   - codigos_skp: códigos que llegan de SketchUp (con X = ancho variable)
#   - codigos_sg:  códigos reales de Schmidt Groupe (piezas de longitud fija)
#   - codigos:     unión de los dos anteriores (para excepciones globales)
#   - resolucion:  mapeo de SKP → [pieza 3600mm, pieza 1800mm]
# -----------------------------------------------------------------------------
rodapiés:
  op_401_desde_acabado: true   # modulo_c lee "Acabado" y lo mapea como op_401
  codigos_skp:
    - SOCX10
    - SOCX07
  codigos_sg:
    - SOC36010
    - SOC18010
    - SOC3607
    - SOC1807
  codigos:
    - SOCX10
    - SOCX07
    - SOC36010
    - SOC18010
    - SOC3607
    - SOC1807
  resolucion:
    SOCX10:
      - SOC36010   # pieza 3600 mm, alto 100 mm
      - SOC18010   # pieza 1800 mm, alto 100 mm
    SOCX07:
      - SOC3607    # pieza 3600 mm, alto 70 mm
      - SOC1807    # pieza 1800 mm, alto 70 mm

# -----------------------------------------------------------------------------
# rodapiés_pieza_unica — SO250*LAM / SO250*LIN
# Llegan de SKP con el mismo código que va a SG. Una sola longitud de pieza por código.
# La cantidad mínima = ceil(ancho_total / ancho_pieza_mm).
# -----------------------------------------------------------------------------
rodapiés_pieza_unica:
  SO25010LAM:
    ancho_pieza_mm: 3000
    alto_mm: 100
    gama: LAMINADO
  SO2507LAM:
    ancho_pieza_mm: 3000
    alto_mm: 70
    gama: LAMINADO
  SO25010LIN:
    ancho_pieza_mm: 2750
    alto_mm: 100
    gama: LINOLEO
  SO2507LIN:
    ancho_pieza_mm: 2750
    alto_mm: 70
    gama: LINOLEO


